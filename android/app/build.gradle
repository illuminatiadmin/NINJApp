plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ninjapp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ninjapp'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}

// ── Empaquetar la web dentro del APK (modo offline) ──────────────────────
// Copia el contenido web del repositorio a src/main/assets/web antes de
// cada compilación, para que la app cargue sin internet. Fuente única de
// verdad: los archivos en la raíz del repo.
def webSrcDir = "${rootProject.projectDir}/.."
def webDestDir = "${projectDir}/src/main/assets/web"

tasks.register('copyWebAssets', Copy) {
    doFirst { delete webDestDir }
    from(webSrcDir) {
        include 'index.html'
        include 'manifest.json'
        include 'sw.js'
        include 'version.json'
        include 'css/**'
        include 'js/**'
        include 'icons/**'
    }
    into webDestDir
    includeEmptyDirs = false
}

tasks.named('preBuild').configure { dependsOn 'copyWebAssets' }
