<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head><body>
<title>Planilla Justa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: app de una columna; barra de pestañas arriba en escritorio y abajo en celular. La planilla se ve por semana (grilla de chips) o por día (lista). */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --soft:#eceff7; --ink:#151827; --muted:#646b82; --line:#e1e5ef;
  --accent:#ff6a3d; --accent-soft:#ffe6dc; --mint:#13a58a; --warn:#c77a00; --danger:#d4382c;
  --mix:62%; --shadow:0 1px 2px rgb(21 24 39 / .06),0 6px 20px rgb(21 24 39 / .06);
  --font-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1017; --surface:#171a24; --soft:#202432; --ink:#eef0f7; --muted:#9aa1b8; --line:#272b3a;
  --accent:#ff825c; --accent-soft:#3a2219; --mint:#3fd0b0; --warn:#f0b04a; --danger:#ff7b70;
  --mix:42%; --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1017; --surface:#171a24; --soft:#202432; --ink:#eef0f7; --muted:#9aa1b8; --line:#272b3a;
  --accent:#ff825c; --accent-soft:#3a2219; --mint:#3fd0b0; --warn:#f0b04a; --danger:#ff7b70;
  --mix:42%; --shadow:0 1px 2px rgb(0 0 0 / .3),0 8px 24px rgb(0 0 0 / .25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:24px;margin:0;line-height:1;letter-spacing:-.02em}
.brand small{color:var(--muted);font-size:13px}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-weight:800;font-size:17px;flex:none}
.iconbtn:hover{border-color:var(--ink)}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:16px;box-shadow:var(--shadow);width:max-content;max-width:100%}
nav.tabs button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:9px 16px;border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
@media (max-width:720px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;width:auto;max-width:none;margin:0;border-radius:18px 18px 0 0;border-bottom:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 8px;flex:1}
  nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:#1d0d06;border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.weekbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.weekbar .lbl{min-width:0;padding-inline:4px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.weekbar .wk{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--soft)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok i{background:var(--mint)} .status.draft i{background:var(--warn)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;box-shadow:var(--shadow)}
.banner b.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-width:0}
.planwrap{overflow-x:auto;padding:6px}
table.plan{border-collapse:separate;border-spacing:4px;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
table.plan th{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 2px}
table.plan th .num{display:block;font-family:var(--font-display);font-size:20px;color:var(--ink);line-height:1.1}
table.plan th.today .num{color:var(--accent)}
table.plan .name{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;min-width:168px;padding:2px 8px 2px 4px;font-size:14px;font-weight:500;white-space:nowrap}
table.plan tr.grp td{padding:12px 4px 2px}
.sector{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sector i{width:10px;height:10px;border-radius:3px;background:var(--c)}
table.plan td.meta{font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 6px}
.chip{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:122px;min-height:34px;padding:5px 8px;border-radius:10px;border:0;background:color-mix(in srgb,var(--c,var(--soft)) var(--mix),var(--surface));font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;text-align:center;cursor:pointer;line-height:1.2}
.chip:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.chip.free{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.chip.free:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.chip.empty{background:var(--soft);color:var(--muted);font-weight:500}
.chip.preview{font-style:italic}
.chip.pin::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.chip.falta{box-shadow:inset 0 0 0 2px var(--danger)}
.chip small{display:block;font-weight:500;text-transform:none;letter-spacing:0;font-size:11px;opacity:.85}
.chip.static{cursor:default}
.chip.static:hover{box-shadow:inset 0 0 0 1.5px var(--line)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.days button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 12px;cursor:pointer;text-align:center;min-width:54px}
.days button b{display:block;font-family:var(--font-display);font-size:20px;line-height:1.1}
.days button span{font-size:12px;color:var(--muted);font-weight:700}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.75}
.daylist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.daylist .card{padding:12px 14px}
.prow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--c,var(--soft)) 55%,var(--surface));flex:none}
.prow .who{flex:1;min-width:0}
.prow .who div{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .who small{color:var(--muted);font-size:12px}
.prow .chip{width:auto;min-width:0;max-width:52%;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:color-mix(in srgb,var(--c) var(--mix),var(--surface));box-shadow:inset 0 0 0 1px var(--line)}
h2{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:4px 0 4px;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:800;font-size:19px;margin:22px 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:70ch;margin:0 0 14px}
.headrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.person{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;cursor:pointer;width:100%}
.person:hover{border-color:var(--ink)}
.person.off{opacity:.55}
.person .who{flex:1;min-width:0}
.person .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .who small{color:var(--muted);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.tag.hot{background:var(--accent-soft);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.item .who{flex:1;min-width:160px}
.item small{color:var(--muted)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:12px}
.task{padding:14px}
.task .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.swatch{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);padding:0;cursor:pointer;overflow:hidden;background:none}
.swatch::-webkit-color-swatch-wrapper{padding:0}.swatch::-webkit-color-swatch{border:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted);min-width:0}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.in{font-size:15px;font-weight:500;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:9px 12px;width:100%}
.field input:focus,.field select:focus,.in:focus{border-color:var(--ink);outline:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.counter{display:flex;flex-wrap:wrap;gap:6px}
.counter label{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:var(--muted);gap:2px}
.counter input{width:46px;text-align:center;font-weight:700;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:6px 2px;color:var(--ink)}
.who-can{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.who-can .grpname{width:100%;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.pchip{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.pchip.si{border-style:solid;background:var(--soft);color:var(--ink);font-weight:600}
.pchip.prefiere{border-style:solid;background:color-mix(in srgb,var(--mint) 22%,var(--surface));border-color:var(--mint);color:var(--ink);font-weight:600}
.pchip.evita{border-style:solid;background:color-mix(in srgb,var(--warn) 18%,var(--surface));border-color:var(--warn);color:var(--ink);font-weight:600}
.keyrow{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);margin:6px 0 10px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgb(10 12 20 / .5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:22px;padding:20px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
@media (max-width:720px){ .sheet-bg{align-items:flex-end;padding:0} .sheet{border-radius:22px 22px 0 0;width:100%;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))} }
.sheet h3{margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.why{display:flex;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.why b{color:var(--accent);flex:none}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:6px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.01em}
.opt i{width:14px;height:14px;border-radius:4px;flex:none;background:color-mix(in srgb,var(--c,transparent) var(--mix),var(--surface));box-shadow:inset 0 0 0 1px var(--line)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.opt.auto{text-transform:none;grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.actions .left{margin-right:auto}
.result{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.result li{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px}
textarea{width:100%;min-height:110px;font-family:ui-monospace,monospace;font-size:12.5px;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
/* guía */
.coach-block{position:fixed;inset:0;z-index:30}
.coach-ring{position:fixed;z-index:31;border-radius:16px;box-shadow:0 0 0 3px var(--accent),0 0 0 9999px rgb(10 12 20 / .62);pointer-events:none}
.coach-ring.center{left:50%;top:50%;width:0;height:0;box-shadow:0 0 0 9999px rgb(10 12 20 / .62)}
.coach{position:fixed;z-index:32;background:var(--surface);color:var(--ink);border-radius:20px;padding:16px 18px;width:min(340px,calc(100% - 32px));box-shadow:0 20px 60px rgb(0 0 0 / .35)}
.coach .step{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.coach h4{font-family:var(--font-display);font-size:20px;margin:4px 0 6px;letter-spacing:-.01em}
.coach p{margin:0;font-size:14.5px;color:var(--muted)}
.coach .dots{display:flex;gap:4px;margin-top:12px}
.coach .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.coach .dots i.on{background:var(--accent);width:16px;border-radius:3px}
.coach .actions{margin-top:12px}
.muted{color:var(--muted)} .sm{font-size:13px}
@media (prefers-reduced-motion: no-preference){
  .coach,.sheet{animation:pop .22s ease-out}
  .coach-ring{transition:left .25s,top .25s,width .25s,height .25s}
  @keyframes pop{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

<div class="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 15l2.5 2.5L16 13"/></svg></div>
    <div class="brand"><h1>Planilla Justa</h1><small>Turnos de la semana, sin vueltas</small></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="btnAyuda" data-a="guia" aria-label="Ver la guía" title="Ver la guía">?</button>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="planilla" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planilla</button>
    <button role="tab" data-v="equipo" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.7.2 4.6 2 5.3 5"/></svg>Equipo</button>
    <button role="tab" data-v="puestos" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Puestos</button>
    <button role="tab" data-v="ajustes" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
  </nav>
  <div id="storageWarn" class="banner" hidden><b class="dot"></b><div>Este navegador no deja guardar datos. Antes de cerrar, copiá tus datos desde <b>Ajustes → Respaldo</b>.</div></div>
  <section id="v-planilla"></section>
  <section id="v-equipo" hidden></section>
  <section id="v-puestos" hidden></section>
  <section id="v-ajustes" hidden></section>
</div>
<div id="sheet" class="sheet-bg" hidden></div>
<div id="coach" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
'use strict';
const KEY = 'planilla-justa-v1';
const DIAS = ['lun','mar','mie','jue','vie','sab','dom'];
const LAB = ['lun','mar','mie','jue','vie','sab'];
const SEM = ['lun','mar','mie','jue','vie'];
const DIA_LARGO = {lun:'Lunes',mar:'Martes',mie:'Miércoles',jue:'Jueves',vie:'Viernes',sab:'Sábado',dom:'Domingo'};
const DIA_CORTO = {lun:'Lun',mar:'Mar',mie:'Mié',jue:'Jue',vie:'Vie',sab:'Sáb',dom:'Dom'};
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','setiembre','octubre','noviembre','diciembre'];
const MES_C = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const COLOR_LIC = '#8fb8e3', COLOR_FALTA = '#f3a6a0', COLOR_TXT = '#c9cdd8';
const PREF = {prefiere:0, si:1, evita:2};
const DIAS_MES = 20;

/* ---------- utilidades ---------- */
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const lunesDe = s => { const d = parse(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return iso(d); };
const fechaDe = (w,dia) => addDays(w, DIAS.indexOf(dia));
const weekIndex = w => { const d = parse(w); return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/(7*864e5)); };
const ddmm = s => { const d = parse(s); return d.getDate()+'/'+(d.getMonth()+1); };
const dmes = s => { const d = parse(s); return d.getDate()+' '+MES_C[d.getMonth()]; };
const hoy = () => iso(new Date());
function hash(str){ let h = 2166136261; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return h>>>0; }
const uid = p => p + Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iniciales = n => { const p = n.replace(',', '').split(/\s+/).filter(Boolean); return (((p[1]||'')[0]||'') + ((p[0]||'')[0]||'')).toUpperCase(); };
const nombreCorto = n => { const [ap, no] = n.split(',').map(s=>s.trim()); return no ? `${no.split(' ')[0]} ${ap}` : n; };
const ls = { get(k){ try { return localStorage.getItem(KEY+':'+k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(KEY+':'+k, v); } catch(e){} } };

function migrar(s){
  s.config ||= {}; s.config.compensatorios ||= ['mar','mie','jue']; s.config.ventana ||= 12;
  s.config.descansos ||= []; s.config.inicioFecha ||= '';
  for (const g of s.grupos) g.maxLibres ??= 0;
  for (const e of s.empleados){ e.inicioSab ??= ''; e.inicioSinCom ??= ''; }
  for (const l of s.licencias ||= []) l.parcial ??= false;
  s.semanas ||= {};
  for (const sem of Object.values(s.semanas)){ sem.porque ||= {}; sem.descansos ||= {}; }
  s.version = 2; return s;
}

/* ---------- estado ---------- */
let storageOk = true;
function cargar(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const s = JSON.parse(raw); if (s && Array.isArray(s.empleados)) return migrar(s); } }
  catch(e){ storageOk = false; }
  return ejemplo();
}
function guardar(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; } catch(e){ storageOk = false; }
  document.getElementById('storageWarn').hidden = storageOk;
}
let state = cargar();
let vista = ls.get('vista') || 'planilla'; if (!['planilla','equipo','puestos','ajustes'].includes(vista)) vista = 'planilla';
let modo = ls.get('modo') || (window.innerWidth < 720 ? 'dia' : 'semana');
let week = lunesDe(hoy());
let dia = diaInicial();
function diaInicial(){ const i = Math.round((parse(hoy())-parse(week))/864e5); return i>=0 && i<6 ? DIAS[i] : 'lun'; }

const grupo = id => state.grupos.find(g=>g.id===id);
const tarea = id => state.tareas.find(t=>t.id===id);
const emp = id => state.empleados.find(e=>e.id===id);
const baseDe = e => (e.base||'').trim() || grupo(e.grupo)?.base || 'LOCAL';
const activos = () => state.empleados.filter(e=>e.activo);
const trabaja = c => !!c && (c.t==='base' || c.t==='tarea' || c.t==='texto');
const elegible = (e,t) => !!t.elegibles?.[e.id] && t.elegibles[e.id] !== 'no';
const ausenciaEn = (eid,f) => state.licencias.find(l=>l.emp===eid && !l.parcial && l.desde<=f && f<=l.hasta);
const notaEn = (eid,f) => state.licencias.find(l=>l.emp===eid && l.parcial && l.desde<=f && f<=l.hasta);
function semana(w){ const s = state.semanas[w] ||= {celdas:{}, descansos:{}, porque:{}, confirmada:false, generada:false}; s.porque ||= {}; s.descansos ||= {}; return s; }
function setPorque(sem, eid, d, txt){ (sem.porque[eid] ||= {})[d] = txt; }

/* ---------- historial ---------- */
function nuevoStat(){ return {pres:0, semanas:0, sab:0, ultSab:'', sinCom:0, tareas:{}, ultima:{}}; }
function acumular(st, w, sem){
  for (const [eid, cs] of Object.entries(sem.celdas||{})){
    const s = st[eid]; if (!s) continue;
    let presente = false;
    for (const d of LAB){
      const c = cs[d]; if (!trabaja(c)) continue;
      presente = true; s.pres++;
      const f = fechaDe(w,d);
      if (d==='sab'){ s.sab++; if (f > s.ultSab) s.ultSab = f; }
      if (c.t==='tarea'){
        const t = tarea(c.id); if (!t) continue;
        s.tareas[t.id] = (s.tareas[t.id]||0)+1;
        if (!s.ultima[t.id] || f > s.ultima[t.id]) s.ultima[t.id] = f;
        if (t.sinComision) s.sinCom++;
      }
    }
    if (presente) s.semanas++;
  }
}
function estadisticas(w, incluir){
  const desde = addDays(w, -7*(+state.config.ventana||12));
  const st = {}; for (const e of state.empleados) st[e.id] = nuevoStat();
  for (const [k, sem] of Object.entries(state.semanas)){
    if (k < desde || k > w) continue;
    if (k === w){ if (!incluir || !sem.generada) continue; }
    else if (!sem.confirmada) continue;
    acumular(st, k, sem);
  }
  // punto de partida cargado a mano
  const ini = state.config.inicioFecha;
  for (const e of state.empleados){
    const s = st[e.id];
    if (e.inicioSab && e.inicioSab < w && e.inicioSab > s.ultSab) s.ultSab = e.inicioSab;
    if (ini && ini >= desde && ini <= w){ s.pres += DIAS_MES; s.sinCom += +e.inicioSinCom || 0; }
  }
  return st;
}
function cmpClave(a,b){
  for (let i=0;i<a.length;i++){
    if (typeof a[i] === 'string'){ if (a[i] !== b[i]) return a[i] < b[i] ? -1 : 1; }
    else if (Math.abs(a[i]-b[i]) > 1e-9) return a[i]-b[i];
  }
  return 0;
}
/* contadores de la semana w: historial + lo que ya hay en "cel" */
function contadores(w, cel){
  const hist = estadisticas(w, false), cur = {};
  for (const e of activos()){
    const h = hist[e.id], cs = cel[e.id] || {};
    let presSem = 0;
    for (const d of LAB){ const c = cs[d]; if (d==='sab' ? trabaja(c) : (!c || trabaja(c))) presSem++; }
    const s = cur[e.id] = {pres:h.pres+presSem, sinCom:h.sinCom, tareas:{...h.tareas}, ultima:{...h.ultima}};
    for (const d of LAB){ const c = cs[d]; if (c?.t==='tarea'){ const t = tarea(c.id); if (!t) continue; s.tareas[t.id]=(s.tareas[t.id]||0)+1; if (t.sinComision) s.sinCom++; } }
  }
  return cur;
}
const clave = (cur,w,e,t,pen) => { const s = cur[e.id], den = Math.max(1,s.pres);
  return [pen, t.sinComision ? s.sinCom/den : 0, (s.tareas[t.id]||0)/den, PREF[t.elegibles[e.id]] ?? 1, s.ultima[t.id]||'', hash(w+e.id+t.id)]; };
function porqueTarea(cur, lista, t){
  const a = lista[0], s = cur[a.e.id];
  let txt = t.sinComision ? `Es quien menos veces estuvo en puestos sin comisión últimamente (${s.sinCom} de ${Math.max(1,s.pres)} días).` : `Es quien menos veces hizo este puesto últimamente.`;
  if (lista.length>1 && cmpClave(a.k.slice(0,3), lista[1].k.slice(0,3))===0)
    txt += a.k[3]!==lista[1].k[3] ? ' Había empate y se tuvo en cuenta que le gusta este puesto.' : a.k[4]!==lista[1].k[4] ? ' Había empate: hacía más tiempo que no le tocaba.' : ' Había empate y se sorteó.';
  return txt;
}

/* ---------- generador ---------- */
function generar(w){
  const sem = semana(w);
  const act = activos();
  const cel = {}, porque = {}, avisos = [];
  const get = (e,d) => cel[e.id][d];
  const set = (e,d,c,why) => { cel[e.id][d] = c; if (why) (porque[e.id] ||= {})[d] = why; };

  // 1. lo fijado a mano
  for (const e of act){ cel[e.id] = {}; for (const d of LAB){ const c = sem.celdas?.[e.id]?.[d]; if (c?.fijo){ cel[e.id][d] = c; const p = sem.porque?.[e.id]?.[d]; if (p) (porque[e.id] ||= {})[d] = p; } } }
  // 2. ausencias de día completo
  for (const e of act) for (const d of LAB){ if (!get(e,d)){ const l = ausenciaEn(e.id, fechaDe(w,d)); if (l) set(e,d,{t:'ausencia', txt:l.motivo||'LICENCIA'}); } }
  // 3. libre fijo
  for (const e of act) if (e.libreFijo && !get(e,e.libreFijo)) set(e,e.libreFijo,{t:'libre'},'Es su día libre fijo.');

  const hist = estadisticas(w, false);
  // 4. sábados
  for (const e of act) if (e.sabado==='fijo' && !get(e,'sab')) set(e,'sab',{t:'base'},'Trabaja todos los sábados.');
  for (const g of state.grupos){
    const cupo = +g.cupoSab||0; if (cupo<=0) continue;
    const miembros = act.filter(e=>e.grupo===g.id);
    const faltan = cupo - miembros.filter(e=>trabaja(get(e,'sab'))).length;
    const cands = miembros.filter(e=>e.sabado==='rota' && !get(e,'sab'))
      .map(e=>{ const s = hist[e.id]; return {e, k:[s.ultSab||'', s.semanas ? s.sab/s.semanas : 0, hash(w+e.id+'sab')]}; })
      .sort((a,b)=>cmpClave(a.k,b.k));
    if (faltan > cands.length) avisos.push(`${g.nombre}: faltan personas para el sábado.`);
    for (const x of cands.slice(0, Math.max(0,faltan))){
      const u = hist[x.e.id].ultSab;
      set(x.e,'sab',{t:'base'}, u ? `Le toca sábado: su último sábado fue el ${ddmm(u)}.` : 'Le toca sábado: no tenía sábados registrados.');
    }
  }
  for (const e of act) if (!get(e,'sab')) set(e,'sab',{t:'libre'});
  // 5. libre compensatorio
  for (const e of act){
    if (e.sabado==='fijo' || !trabaja(get(e,'sab'))) continue;
    if (SEM.some(d=>get(e,d)?.t==='libre')) continue;
    const g = grupo(e.grupo), max = +g?.maxLibres||0;
    const libres = d => act.filter(x=>x.grupo===e.grupo && get(x,d)?.t==='libre').length;
    const pref = (state.config.compensatorios||[]).filter(d=>SEM.includes(d) && !get(e,d));
    let ops = pref.filter(d=>!max || libres(d) < max);
    if (!ops.length) ops = SEM.filter(d=>!get(e,d) && (!max || libres(d) < max));
    if (!ops.length) ops = SEM.filter(d=>!get(e,d));
    if (!ops.length){ avisos.push(`${nombreCorto(e.nombre)} trabaja el sábado y no le queda día para librar.`); continue; }
    ops.sort((a,b)=>libres(a)-libres(b) || hash(w+e.id+a)-hash(w+e.id+b));
    set(e,ops[0],{t:'libre'},'Libre por trabajar el sábado.');
  }

  const cur = contadores(w, cel);
  const disponible = (e,d) => {
    if (notaEn(e.id, fechaDe(w,d))) return false;
    return d==='sab' ? (get(e,'sab')?.t==='base' && !get(e,'sab').fijo) : !get(e,d);
  };
  const asignados = (t,d) => act.filter(e=>{ const c = get(e,d); return c?.t==='tarea' && c.id===t.id; }).length;
  const asignar = (e,t,d,why) => { set(e,d,{t:'tarea', id:t.id}, why); const s = cur[e.id]; s.tareas[t.id]=(s.tareas[t.id]||0)+1; if (t.sinComision) s.sinCom++; s.ultima[t.id] = fechaDe(w,d); };

  // 6. puestos de toda la semana
  for (const t of state.tareas.filter(t=>t.modo==='semanal')){
    const maxC = Math.max(0, ...LAB.map(d=>+t.cupos[d]||0));
    for (let k=0;k<maxC;k++){
      const dias = LAB.filter(d=>(+t.cupos[d]||0)>k && asignados(t,d)<(+t.cupos[d]||0));
      if (!dias.length) continue;
      const lista = act.filter(e=>elegible(e,t)).map(e=>({e, pen:dias.filter(d=>!disponible(e,d)).length}))
        .filter(x=>x.pen<dias.length).map(x=>({e:x.e, k:clave(cur,w,x.e,t,x.pen)})).sort((a,b)=>cmpClave(a.k,b.k));
      if (!lista.length){ avisos.push(`Nadie disponible para ${t.nombre}.`); continue; }
      const why = 'Toda la semana. ' + porqueTarea(cur, lista, t);
      for (const d of dias) if (disponible(lista[0].e,d)) asignar(lista[0].e,t,d,why);
    }
  }
  // 7. puestos por día
  for (const d of LAB){
    for (const t of state.tareas){
      let falta = (+t.cupos[d]||0) - asignados(t,d);
      while (falta > 0){
        const lista = act.filter(e=>elegible(e,t) && disponible(e,d)).map(e=>({e, k:clave(cur,w,e,t,0)})).sort((a,b)=>cmpClave(a.k,b.k));
        if (!lista.length){ avisos.push(`${DIA_LARGO[d]}: nadie disponible para ${t.nombre}.`); break; }
        asignar(lista[0].e,t,d,porqueTarea(cur, lista, t));
        falta--;
      }
    }
  }
  // 8. el resto, tarea base
  for (const e of act) for (const d of SEM) if (!get(e,d)) set(e,d,{t:'base'});
  // 9. descansos rotativos
  const slots = (state.config.descansos||[]).map(s=>s.trim()).filter(Boolean);
  const desc = {};
  for (const [eid,v] of Object.entries(sem.descansos||{})) if (v?.fijo) desc[eid] = v;
  if (slots.length){
    const wi = weekIndex(w);
    for (const g of state.grupos){
      act.filter(e=>e.grupo===g.id && e.descanso && !desc[e.id] && LAB.some(d=>trabaja(get(e,d))))
        .forEach((e,i)=>{ desc[e.id] = {txt:slots[(i+wi)%slots.length]}; });
    }
  }
  for (const [eid,cs] of Object.entries(sem.celdas||{})) if (!cel[eid]) cel[eid] = cs;
  Object.assign(sem, {celdas:cel, descansos:desc, porque, avisos, generada:true});
  state.ejemplo = false;
  guardar();
  return avisos;
}

/* ---------- faltas imprevistas ---------- */
function avisarFalta(w, eid, d, motivo){
  const sem = semana(w), e = emp(eid);
  sem.celdas[eid] ||= {};
  const prev = sem.celdas[eid][d];
  sem.celdas[eid][d] = {t:'ausencia', txt:motivo, fijo:true, falta:true};
  setPorque(sem, eid, d, `Avisó: ${motivo.toLowerCase()}.`);
  const dl = DIA_LARGO[d];
  if (prev?.t==='tarea'){
    const t = tarea(prev.id);
    if (t){
      const cur = contadores(w, sem.celdas);
      const lista = activos().filter(x=>x.id!==eid && elegible(x,t) && sem.celdas[x.id]?.[d]?.t==='base' && !sem.celdas[x.id][d].fijo && !notaEn(x.id, fechaDe(w,d)))
        .map(x=>({e:x, k:clave(cur,w,x,t,0)})).sort((a,b)=>cmpClave(a.k,b.k));
      if (!lista.length) return `${dl}: no hay nadie libre para cubrir ${t.nombre}. Asignalo a mano.`;
      const r = lista[0].e;
      sem.celdas[r.id][d] = {t:'tarea', id:t.id, fijo:true};
      setPorque(sem, r.id, d, `Cubre ${t.nombre} porque faltó ${nombreCorto(e.nombre)}. ${porqueTarea(cur, lista, t)}`);
      return `${dl}: ${t.nombre} pasa a ${nombreCorto(r.nombre)}.`;
    }
  }
  if (d==='sab' && trabaja(prev)) return `${dl}: el sábado queda con una persona menos. Revisá si sigue correspondiendo su día libre.`;
  return `${dl}: anotado.`;
}

/* ---------- celdas ---------- */
function celdaVista(e,d,sem){
  if (d==='dom') return {txt:'FREE', color:'', cls:'free static', nota:''};
  const f = fechaDe(week,d);
  const nota = notaEn(e.id,f);
  let c = sem?.celdas?.[e.id]?.[d], preview = false;
  if (!c){ const l = ausenciaEn(e.id, f); if (l){ c = {t:'ausencia', txt:l.motivo}; preview = true; } else if (e.libreFijo===d){ c = {t:'libre'}; preview = true; } }
  if (!c) return {txt:'—', color:'', cls:'empty', nota:nota?.motivo||''};
  let txt = '', color = '';
  if (c.t==='base'){ txt = baseDe(e); color = grupo(e.grupo)?.color||''; }
  else if (c.t==='tarea'){ const t = tarea(c.id); txt = t ? t.nombre : '(puesto borrado)'; color = t?.color||''; }
  else if (c.t==='libre') txt = 'FREE';
  else if (c.t==='ausencia'){ txt = c.txt||'LICENCIA'; color = c.falta ? COLOR_FALTA : COLOR_LIC; }
  else { txt = c.txt||''; color = COLOR_TXT; }
  return {txt, color, nota:nota?.motivo||'', cls:(c.t==='libre'?'free ':'')+(c.fijo?'pin ':'')+(c.falta?'falta ':'')+(preview?'preview':'')};
}
function chipHTML(e,d,sem){
  if (d==='dom') return `<span class="chip free static">FREE</span>`;
  const v = celdaVista(e,d,sem);
  return `<button class="chip ${v.cls}" data-e="${e.id}" data-d="${d}" style="${v.color?`--c:${v.color}`:''}">${esc(v.txt)}${v.nota?`<small>${esc(v.nota)}</small>`:''}</button>`;
}

/* ---------- vista Planilla ---------- */
function tituloMes(w){
  const a = parse(w), b = parse(addDays(w,6));
  return a.getMonth()===b.getMonth() ? `${MESES[a.getMonth()]} ${a.getFullYear()}` : `${MESES[a.getMonth()]} – ${MESES[b.getMonth()]} ${b.getFullYear()}`;
}
function renderPlanilla(){
  const sem = state.semanas[week];
  const conf = !!sem?.confirmada, gen = !!sem?.generada;
  const prev = state.semanas[addDays(week,-7)];
  const a = parse(week), b = parse(addDays(week,6));
  const rango = a.getMonth()===b.getMonth() ? `${a.getDate()} – ${b.getDate()} ${MES_C[b.getMonth()]}` : `${a.getDate()} ${MES_C[a.getMonth()]} – ${b.getDate()} ${MES_C[b.getMonth()]}`;
  let h = `<div class="weekbar" id="weekNav">
      <button class="iconbtn" data-a="prev" aria-label="Semana anterior">‹</button>
      <div class="lbl"><div class="eyebrow">${tituloMes(week)}</div><div class="wk">${rango}</div></div>
      <button class="iconbtn" data-a="next" aria-label="Semana siguiente">›</button>
      ${week!==lunesDe(hoy())?'<button class="btn sm ghost" data-a="hoy">Hoy</button>':''}
    </div>
    <div class="toolbar">
      <span class="status ${conf?'ok':gen?'draft':''}" id="estado"><i></i>${conf?'Confirmada':gen?'Borrador':'Sin armar'}</span>
      <span class="seg" id="viewToggle"><button data-a="modo" data-m="semana" aria-pressed="${modo==='semana'}">Semana</button><button data-a="modo" data-m="dia" aria-pressed="${modo==='dia'}">Día</button></span>
      <span class="spacer"></span>
      <button class="btn" id="btnFalta" data-a="falta"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>Avisar falta</button>
      ${conf ? '' : `<button class="btn ${gen?'':'accent'}" id="btnGenerar" data-a="generar"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>${gen?'Rearmar':'Armar semana'}</button>`}
      ${gen ? (conf ? '<button class="btn" id="btnConfirmar" data-a="reabrir">Reabrir</button>' : '<button class="btn primary" id="btnConfirmar" data-a="confirmar"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Confirmar</button>') : ''}
      <button class="btn" data-a="excel" ${gen?'':'disabled'} title="Copiar para pegar en Excel"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>Excel</button>
    </div>`;
  if (state.ejemplo) h += `<div class="banner"><b class="dot"></b><div>Cargué tu equipo y las licencias de la planilla del 28/9 como punto de partida. Revisá <b>Equipo</b> y <b>Puestos</b>, y después tocá <b>Armar semana</b>.</div></div>`;
  if (!conf && prev?.generada && !prev.confirmada) h += `<div class="banner"><b class="dot"></b><div>La semana anterior quedó sin confirmar. Confirmala así la rotación sigue bien.</div></div>`;
  if (gen && sem.avisos?.length) h += `<div class="banner"><b class="dot"></b><div>${sem.avisos.map(esc).join('<br>')}</div></div>`;
  h += `<div id="planArea">`;
  if (modo==='semana'){
    const t = hoy();
    h += `<div class="card planwrap"><table class="plan"><thead><tr><th class="name"></th>${DIAS.map(d=>{ const f = fechaDe(week,d); return `<th class="${f===t?'today':''}">${DIA_CORTO[d]}<span class="num">${parse(f).getDate()}</span></th>`; }).join('')}<th>Horario</th><th>Puesto</th><th>Descanso</th></tr></thead><tbody>`;
    for (const g of state.grupos){
      const ms = activos().filter(e=>e.grupo===g.id); if (!ms.length) continue;
      h += `<tr class="grp"><td class="name"><span class="sector" style="--c:${esc(g.color)}"><i></i>${esc(g.nombre)}</span></td><td colspan="10"></td></tr>`;
      for (const e of ms){
        const ds = sem?.descansos?.[e.id];
        h += `<tr><td class="name">${esc(e.nombre)}</td>${DIAS.map(d=>`<td>${chipHTML(e,d,sem)}</td>`).join('')}
          <td class="meta">${esc(e.horario)}</td><td class="meta">${esc(e.puesto)}</td>
          <td><button class="chip free ${ds?.fijo?'pin':''}" style="min-width:110px" data-e="${e.id}" data-d="desc">${esc(ds?.txt||'—')}</button></td></tr>`;
      }
    }
    h += `</tbody></table></div>`;
  } else {
    h += `<div class="days">${LAB.map(d=>{ const f = fechaDe(week,d); return `<button data-a="dia" data-d="${d}" aria-pressed="${dia===d}"><span>${DIA_CORTO[d]}</span><b>${parse(f).getDate()}</b></button>`; }).join('')}</div><div class="daylist">`;
    for (const g of state.grupos){
      const ms = activos().filter(e=>e.grupo===g.id); if (!ms.length) continue;
      h += `<div class="card"><div class="sector" style="--c:${esc(g.color)};margin-bottom:6px"><i></i>${esc(g.nombre)}</div>`;
      for (const e of ms){
        const ds = sem?.descansos?.[e.id];
        const sub = [e.horario, trabaja(sem?.celdas?.[e.id]?.[dia]) && ds?.txt ? 'descanso '+ds.txt : ''].filter(Boolean).join(' · ');
        h += `<div class="prow"><span class="avatar" style="--c:${esc(g.color)}">${esc(iniciales(e.nombre))}</span><div class="who"><div>${esc(nombreCorto(e.nombre))}</div><small>${esc(sub)}</small></div>${chipHTML(e,dia,sem)}</div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  const usados = new Map();
  for (const g of state.grupos) if (g.color && activos().some(e=>e.grupo===g.id)) usados.set(g.base, g.color);
  for (const t of state.tareas) usados.set(t.nombre, t.color);
  usados.set('LICENCIA', COLOR_LIC); usados.set('FALTA', COLOR_FALTA);
  h += `<div class="legend">${[...usados].map(([n,c])=>`<span><i style="--c:${esc(c)}"></i>${esc(n)}</span>`).join('')}<span><i style="--c:transparent"></i>FREE</span><span>● cambiado a mano</span></div>`;
  document.getElementById('v-planilla').innerHTML = h;
}

/* ---------- hojas (modales) ---------- */
const sheet = document.getElementById('sheet');
function abrirHoja(html, data={}){
  sheet.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  for (const k of Object.keys(sheet.dataset)) delete sheet.dataset[k];
  Object.assign(sheet.dataset, data); sheet.hidden = false;
  (sheet.querySelector('.opt[aria-pressed="true"]') || sheet.querySelector('input,select,button'))?.focus();
}
function cerrarHoja(){ sheet.hidden = true; sheet.innerHTML = ''; for (const k of Object.keys(sheet.dataset)) delete sheet.dataset[k]; }

function abrirCelda(eid, d){
  const e = emp(eid); if (!e) return;
  const sem = semana(week);
  let opts = [], actual = 'auto', txtAct = '';
  if (d==='desc'){
    const cur = sem.descansos?.[eid];
    opts.push({v:'auto', l:'Que lo decida la app'});
    for (const s of state.config.descansos||[]) if (s.trim()) opts.push({v:'d:'+s, l:s});
    opts.push({v:'texto', l:'Otro horario'});
    if (cur?.fijo){ actual = state.config.descansos.includes(cur.txt) ? 'd:'+cur.txt : 'texto'; if (actual==='texto') txtAct = cur.txt; }
  } else {
    const c = sem.celdas?.[eid]?.[d];
    opts.push({v:'auto', l:'Que lo decida la app'});
    opts.push({v:'base', l:baseDe(e), c:grupo(e.grupo)?.color});
    opts.push({v:'libre', l:'FREE'});
    opts.push({v:'lic', l:'LICENCIA', c:COLOR_LIC});
    for (const t of state.tareas) opts.push({v:'t:'+t.id, l:t.nombre, c:t.color});
    opts.push({v:'texto', l:'Otro…', c:COLOR_TXT});
    if (c?.fijo){ actual = c.t==='base'?'base':c.t==='libre'?'libre':c.t==='ausencia'&&!c.falta?'lic':c.t==='tarea'?'t:'+c.id:'texto'; if (actual==='texto') txtAct = c.txt||''; }
  }
  const cdat = d!=='desc' && sem.celdas?.[eid]?.[d];
  const whyTxt = (d!=='desc' && sem.porque?.[eid]?.[d]) || (cdat?.t==='base' ? 'Hace su tarea de siempre.' : '');
  abrirHoja(`<h3>${esc(nombreCorto(e.nombre))}</h3>
    <p class="sub">${d==='desc' ? 'Horario de descanso esta semana' : `${DIA_LARGO[d]} ${ddmm(fechaDe(week,d))}`}</p>
    ${whyTxt ? `<div class="why"><b>¿Por qué?</b><span>${esc(whyTxt)}</span></div>` : ''}
    <div class="opts">${opts.map(o=>`<button class="opt ${o.v==='auto'?'auto':''}" data-a="opt" data-v="${esc(o.v)}" aria-pressed="${o.v===actual}">${o.v==='auto'?'':`<i style="--c:${o.c||'transparent'}"></i>`}${esc(o.l)}</button>`).join('')}</div>
    <input class="in" type="text" id="edTxt" placeholder="Escribí, por ejemplo: TELETRABAJO" value="${esc(txtAct)}" ${actual==='texto'?'':'hidden'}>
    <p class="muted sm" style="margin:10px 0 0">Lo que elijas queda fijo aunque vuelvas a armar la semana.</p>
    <div class="actions">${d!=='desc'?'<button class="btn danger left" data-a="faltaCelda">Faltó este día</button>':''}<button class="btn ghost" data-a="cerrar">Cancelar</button><button class="btn primary" data-a="guardarCelda">Guardar</button></div>`,
    {e:eid, d});
}
function guardarCelda(){
  const eid = sheet.dataset.e, d = sheet.dataset.d;
  const v = sheet.querySelector('.opt[aria-pressed="true"]')?.dataset.v || 'auto';
  const raw = document.getElementById('edTxt').value.trim();
  const sem = semana(week);
  if (d==='desc'){
    if (v==='auto') delete sem.descansos[eid];
    else if (v==='texto'){ if (!raw) return toast('Escribí el horario.'); sem.descansos[eid] = {txt:raw, fijo:true}; }
    else sem.descansos[eid] = {txt:v.slice(2), fijo:true};
  } else {
    sem.celdas[eid] ||= {};
    let c = null;
    if (v==='base') c = {t:'base'};
    else if (v==='libre') c = {t:'libre'};
    else if (v==='lic') c = {t:'ausencia', txt:'LICENCIA'};
    else if (v.startsWith('t:')) c = {t:'tarea', id:v.slice(2)};
    else if (v==='texto'){ if (!raw) return toast('Escribí qué hace ese día.'); c = {t:'texto', txt:raw.toUpperCase()}; }
    if (c){ c.fijo = true; sem.celdas[eid][d] = c; setPorque(sem, eid, d, 'Cambiado a mano.'); }
    else { delete sem.celdas[eid][d]; if (sem.porque[eid]) delete sem.porque[eid][d]; }
  }
  cerrarHoja(); guardar(); render();
  toast(v==='auto' ? 'Listo. Se decide la próxima vez que armes la semana.' : 'Guardado.');
}

function abrirFalta(eid, d){
  const marcado = d || (week===lunesDe(hoy()) ? diaInicial() : dia);
  abrirHoja(`<h3>Avisar una falta</h3>
    <p class="sub">Si esa persona tenía un puesto que rota, la app busca quién la cubra.</p>
    <div class="grid2" style="grid-template-columns:1fr">
      <label class="field">Quién falta<select id="fEmp">${activos().map(e=>`<option value="${e.id}" ${e.id===eid?'selected':''}>${esc(e.nombre)}</option>`).join('')}</select></label>
      <div class="field">Qué días<div class="toggles" id="fDias">${LAB.map(x=>`<button class="tog" data-a="tog" data-d="${x}" aria-pressed="${x===marcado}">${DIA_CORTO[x]} ${parse(fechaDe(week,x)).getDate()}</button>`).join('')}</div></div>
      <label class="field">Motivo<select id="fMotivo"><option>FALTA</option><option>ENFERMEDAD</option><option>IMPREVISTO</option><option>DÍA DE ESTUDIO</option></select></label>
    </div>
    <div class="actions"><button class="btn ghost" data-a="cerrar">Cancelar</button><button class="btn primary" data-a="guardarFalta">Avisar</button></div>`);
}
function guardarFalta(){
  const eid = document.getElementById('fEmp').value;
  const dias = [...document.querySelectorAll('#fDias .tog[aria-pressed="true"]')].map(b=>b.dataset.d);
  if (!dias.length) return toast('Elegí al menos un día.');
  const motivo = document.getElementById('fMotivo').value;
  const res = dias.map(d=>avisarFalta(week, eid, d, motivo));
  guardar(); render();
  sheet.querySelector('.sheet').innerHTML = `<h3>Listo</h3><p class="sub">${esc(nombreCorto(emp(eid).nombre))} · ${esc(motivo.toLowerCase())}</p><ul class="result">${res.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><div class="actions"><button class="btn primary" data-a="cerrar">Entendido</button></div>`;
}

/* ---------- vista Equipo ---------- */
function proximosSabados(){
  // estimación del orden de rotación desde la semana visible
  const res = {};
  const sem = state.semanas[week];
  const st = estadisticas(week, true);
  for (const g of state.grupos){
    const cupo = +g.cupoSab||0; if (cupo<=0) continue;
    const ms = activos().filter(e=>e.grupo===g.id && e.sabado==='rota');
    const sab = fechaDe(week,'sab');
    const ya = ms.filter(e=>trabaja(sem?.celdas?.[e.id]?.sab));
    for (const e of ya) res[e.id] = sab;
    const resto = ms.filter(e=>!ya.includes(e)).sort((a,b)=>cmpClave([st[a.id].ultSab||'', hash(a.id)], [st[b.id].ultSab||'', hash(b.id)]));
    const base = sem?.generada ? 1 : 0;
    resto.forEach((e,i)=>{ res[e.id] = addDays(sab, 7*(base + Math.floor(i/cupo))); });
  }
  return res;
}
function renderEquipo(){
  const prox = proximosSabados();
  const st = estadisticas(week, true);
  const sab = fechaDe(week,'sab');
  let h = `<div class="headrow"><h2>Equipo</h2><span class="spacer"></span><button class="btn primary" data-a="nuevaPersona">+ Persona</button></div>
    <p class="lead">Tocá a alguien para editar sus datos, su sector o si trabaja sábados.</p>`;
  for (const g of state.grupos){
    const ms = state.empleados.filter(e=>e.grupo===g.id); if (!ms.length) continue;
    h += `<h3><span class="sector" style="--c:${esc(g.color)};font-size:13px"><i></i>${esc(g.nombre)}</span></h3><div class="people">`;
    for (const e of ms){
      const tags = [];
      if (!e.activo) tags.push('<span class="tag">Inactivo</span>');
      if (e.activo && prox[e.id]) tags.push(prox[e.id]===sab ? '<span class="tag hot">Sábado esta semana</span>' : `<span class="tag">Próx. sábado ≈ ${dmes(prox[e.id])}</span>`);
      if (e.sabado==='fijo') tags.push('<span class="tag">Todos los sábados</span>');
      for (const [id,n] of Object.entries(st[e.id].tareas).sort((a,b)=>b[1]-a[1]).slice(0,2)) if (tarea(id)) tags.push(`<span class="tag">${esc((n=>n.length>18?n.slice(0,17)+'…':n)(tarea(id).nombre.split('(')[0].trim().toLowerCase()))} ×${n}</span>`);
      const f = hoy(); const aus = state.licencias.find(l=>l.emp===e.id && l.hasta>=f && l.desde<=addDays(f,7));
      if (aus) tags.push(`<span class="tag">${esc(aus.motivo.toLowerCase())} ${aus.desde<=f?'hasta '+dmes(aus.hasta):'desde '+dmes(aus.desde)}</span>`);
      h += `<button class="person ${e.activo?'':'off'}" data-a="persona" data-id="${e.id}"><span class="avatar" style="--c:${esc(g.color)}">${esc(iniciales(e.nombre))}</span><span class="who"><b>${esc(nombreCorto(e.nombre))}</b><small>${esc([baseDe(e), e.horario].filter(Boolean).join(' · '))}</small><span class="tags">${tags.join('')}</span></span></button>`;
    }
    h += `</div>`;
  }
  const lic = [...state.licencias].filter(l=>l.hasta >= addDays(hoy(),-30)).sort((a,b)=>a.desde.localeCompare(b.desde));
  h += `<div class="headrow" style="margin-top:28px"><h2>Licencias y cursos</h2><span class="spacer"></span><button class="btn primary" data-a="nuevaAus">+ Agregar</button></div>
    <p class="lead">Licencias, teletrabajo o cursos que ya sabés de antemano. Se aplican solos a las semanas que correspondan.</p>
    <div class="list">${lic.map(l=>{ const e = emp(l.emp); return `<div class="card item"><span class="avatar" style="--c:${esc(grupo(e?.grupo)?.color||'')}">${esc(iniciales(e?.nombre||'?'))}</span><div class="who"><b>${esc(e?nombreCorto(e.nombre):'(borrado)')}</b><br><small>${esc(l.motivo)} · ${l.desde===l.hasta?dmes(l.desde):dmes(l.desde)+' al '+dmes(l.hasta)}${l.parcial?' · parte del día':''}</small></div><button class="btn sm danger" data-a="delLic" data-id="${l.id}">Quitar</button></div>`; }).join('') || '<p class="muted">No hay nada cargado.</p>'}</div>`;
  document.getElementById('v-equipo').innerHTML = h;
}

    <div class="actions">${nuevo?'':`<button class="btn danger left" data-a="delPersona" data-id="${e.id}">Borrar</button>`}<button class="btn ghost" data-a="cerrar">Cancelar</button><button class="btn primary" data-a="guardarPersona">Guardar</button></div>`, {id:e.id});

function guardarPersona(){
  const nombre = document.getElementById('pNombre').value.trim();
  if (!nombre) return toast('Falta el nombre.');
  const id = sheet.dataset.id;
  const datos = {nombre, grupo:document.getElementById('pGrupo').value, base:document.getElementById('pBase').value.trim().toUpperCase(), horario:document.getElementById('pHorario').value.trim(), puesto:document.getElementById('pPuesto').value.trim(), sabado:document.getElementById('pSabado').value, libreFijo:document.getElementById('pLibre').value, descanso:document.getElementById('pDesc').checked, activo:document.getElementById('pActivo').checked};
  if (id) Object.assign(emp(id), datos);
  else state.empleados.push({id:uid('e_'), inicioSab:'', inicioSinCom:'', ...datos});
  guardar(); cerrarHoja(); render(); toast(id ? 'Guardado.' : 'Agregada. Marcá sus puestos en Puestos.');
}

function guardarAusencia(){
  const tipo = document.getElementById('aTipo').value, txt = document.getElementById('aTxt').value.trim();
  const l = {id:uid('l_'), emp:document.getElementById('aEmp').value, desde:document.getElementById('aDesde').value, hasta:document.getElementById('aHasta').value, motivo:'', parcial:false};
  if (tipo==='curso'){ l.motivo = txt || 'curso'; l.parcial = true; }
  else if (tipo==='otro'){ if (!txt) return toast('Escribí el detalle.'); l.parcial = document.getElementById('aParcial').checked; l.motivo = l.parcial ? txt : txt.toUpperCase(); }
  else l.motivo = tipo;
  if (!l.emp || !l.desde || !l.hasta) return toast('Completá quién y las fechas.');
  if (l.hasta < l.desde) return toast('La fecha “hasta” es anterior a “desde”.');
  state.licencias.push(l); guardar(); cerrarHoja(); render();
  const afecta = Object.entries(state.semanas).some(([k,s])=>s.generada && !s.confirmada && k<=l.hasta && addDays(k,6)>=l.desde);
  toast(afecta ? 'Agregado. Rearmá la semana para que se aplique.' : 'Agregado.');
}

let paso = -1;
const objetivo = p => (p.s && document.querySelector(p.s)) || (p.alt && document.querySelector(p.alt)) || null;
function guia(i){
  paso = i;
  const c = document.getElementById('coach');
  if (i<0 || i>=PASOS.length){ paso = -1; c.hidden = true; c.innerHTML = ''; ls.set('guia','vista'); return; }
  const p = PASOS[i];
  if (vista!==p.v){ vista = p.v; render(); }
  const el = objetivo(p);
  if (el) el.scrollIntoView({block:'nearest', inline:'nearest'});
  c.hidden = false;
  c.innerHTML = `<div class="coach-block"></div><div class="coach-ring ${el?'':'center'}"></div>
    <div class="coach" role="dialog" aria-live="polite"><div class="step">Paso ${i+1} de ${PASOS.length}</div><h4>${esc(p.t)}</h4><p>${esc(p.x)}</p>
    <div class="dots">${PASOS.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <div class="actions"><button class="btn ghost sm left" data-a="guiaFin">Saltar</button>${i>0?'<button class="btn sm" data-a="guiaAnt">Atrás</button>':''}<button class="btn primary sm" data-a="guiaSig">${i===PASOS.length-1?'Empezar':'Siguiente'}</button></div></div>`;
  ubicarGuia(el);
  c.querySelector('[data-a="guiaSig"]').focus({preventScroll:true});
}
function ubicarGuia(el){
  const ring = document.querySelector('.coach-ring'), box = document.querySelector('.coach');
  if (!ring || !box) return;
  const W = innerWidth, H = innerHeight, bw = box.offsetWidth, bh = box.offsetHeight;
  if (!el){ box.style.left = (W-bw)/2+'px'; box.style.top = Math.max(16,(H-bh)/2)+'px'; return; }
  const r = el.getBoundingClientRect(), pad = 6;
  const top = Math.max(4, r.top-pad), bottom = Math.min(H-4, r.bottom+pad);
  Object.assign(ring.style, {left:Math.max(4,r.left-pad)+'px', top:top+'px', width:Math.min(W-8,r.width+pad*2)+'px', height:Math.max(0,bottom-top)+'px'});
  let y = bottom + 12;
  if (y + bh > H - 12) y = top - bh - 12;
  if (y < 12) y = Math.max(12, H - bh - 12);
  const x = Math.min(Math.max(16, r.left + r.width/2 - bw/2), W - bw - 16);
  box.style.left = x+'px'; box.style.top = y+'px';
}
addEventListener('resize', ()=>{ if (paso>=0) ubicarGuia(objetivo(PASOS[paso])); });

/* ---------- render general ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.v===vista)));
  for (const v of ['planilla','equipo','puestos','ajustes']) document.getElementById('v-'+v).hidden = v!==vista;
  ({planilla:renderPlanilla, equipo:renderEquipo, puestos:renderPuestos, ajustes:renderAjustes})[vista]();
  document.getElementById('storageWarn').hidden = storageOk;
}
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden=true, 3000); }
async function copiar(texto, ok){
  try { await navigator.clipboard.writeText(texto); toast(ok); }
  catch(e){
    abrirHoja(`<h3>Copiá este texto</h3><p class="sub">El navegador no dejó copiar solo. Seleccioná todo y copialo.</p><textarea id="copiaManual" readonly>${esc(texto)}</textarea><div class="actions"><button class="btn primary" data-a="cerrar">Listo</button></div>`);
    const ta = document.getElementById('copiaManual'); ta.focus(); ta.select();
  }
}
function tsvSemana(){
  const sem = state.semanas[week];
  const filas = [['Funcionario', ...DIAS.map(d=>`${DIA_LARGO[d].toUpperCase()} ${parse(fechaDe(week,d)).getDate()}`), 'Horario', 'Puesto', 'Descanso']];
  for (const g of state.grupos){
    const ms = activos().filter(e=>e.grupo===g.id); if (!ms.length) continue;
    filas.push([g.nombre.toUpperCase()]);
    for (const e of ms) filas.push([e.nombre, ...DIAS.map(d=>{ const v = celdaVista(e,d,sem); return v.txt.replace('—','') + (v.nota?` (${v.nota})`:''); }), e.horario, e.puesto, sem?.descansos?.[e.id]?.txt||'']);
  }
  return filas.map(f=>f.join('\t')).join('\n');
}
function importar(texto){
  try {
    const s = JSON.parse(texto);
    if (!s || !Array.isArray(s.empleados) || !Array.isArray(s.tareas) || !Array.isArray(s.grupos)) throw new Error('formato');
    state = migrar(s); guardar(); vista = 'planilla'; render(); toast('Datos restaurados.');
  } catch(e){ toast('Eso no parece un respaldo de Planilla Justa.'); }
}

/* ---------- eventos ---------- */
document.getElementById('tabs').addEventListener('click', ev=>{

document.addEventListener('click', ev=>{

    case 'guiaAnt': guia(paso-1); break;
    case 'guiaFin': guia(-1); break;

    case 'dia': dia = b.dataset.d; render(); break;
    case 'generar': { const av = generar(week); render(); toast(av.length ? 'Armada, con avisos. Mirá arriba.' : 'Semana armada. Revisala y confirmala.'); break; }
    case 'confirmar': semana(week).confirmada = true; guardar(); render(); toast('¡Confirmada!'); break;
    case 'reabrir': semana(week).confirmada = false; guardar(); render(); toast('Reabierta.'); break;
    case 'excel': copiar(tsvSemana(), 'Copiada. Pegala en Excel.'); break;
    case 'falta': abrirFalta(); break;
    case 'faltaCelda': { const e = sheet.dataset.e, d = sheet.dataset.d; abrirFalta(e, d); break; }
    case 'guardarFalta': guardarFalta(); break;
    case 'tog': b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed')!=='true')); break;

    case 'guardarCelda': guardarCelda(); break;
    case 'cerrar': cerrarHoja(); break;
    case 'persona': abrirPersona(b.dataset.id); break;
    case 'nuevaPersona': abrirPersona(''); break;
    case 'guardarPersona': guardarPersona(); break;
    case 'delPersona': {
      if (b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='¿Seguro? Se borra su historial'; return; }
      const id = b.dataset.id;
      state.empleados = state.empleados.filter(e=>e.id!==id); state.licencias = state.licencias.filter(l=>l.emp!==id);
      for (const t of state.tareas) delete t.elegibles?.[id];
      guardar(); cerrarHoja(); render(); break; }
    case 'nuevaAus': abrirAusencia(); break;
    case 'guardarAus': guardarAusencia(); break;
    case 'delLic': state.licencias = state.licencias.filter(l=>l.id!==b.dataset.id); guardar(); render(); break;
    case 'pchip': {
      const t = tarea(card.dataset.t); t.elegibles ||= {};
      const v = PCICLO[(PCICLO.indexOf(t.elegibles[b.dataset.id]||'no')+1)%PCICLO.length];
      if (v==='no') delete t.elegibles[b.dataset.id]; else t.elegibles[b.dataset.id] = v;
      b.className = 'pchip '+v; guardar(); break; }
    case 'elegTodos': case 'elegNinguno': {
      const t = tarea(card.dataset.t); t.elegibles ||= {};
      for (const e of state.empleados.filter(e=>e.grupo===b.dataset.g)){ if (a==='elegTodos') t.elegibles[e.id] = t.elegibles[e.id] || 'si'; else delete t.elegibles[e.id]; }
      guardar(); render(); break; }
    case 'tmodo': tarea(card.dataset.t).modo = b.dataset.m; guardar(); render(); break;
    case 'addTarea': state.tareas.push({id:uid('t_'), nombre:'NUEVO PUESTO', color:'#b7e1a1', modo:'diario', sinComision:true, cupos:{lun:1,mar:1,mie:1,jue:1,vie:1,sab:0}, elegibles:{}}); guardar(); render(); break;
    case 'delTarea': if (b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='¿Seguro? Tocá de nuevo'; return; } state.tareas = state.tareas.filter(t=>t.id!==b.dataset.id); guardar(); render(); break;
    case 'addGrupo': state.grupos.push({id:uid('g_'), nombre:'Nuevo sector', base:'LOCAL', color:'#9fb3ff', cupoSab:0, maxLibres:0}); guardar(); render(); break;
    case 'delGrupo': if (state.empleados.some(e=>e.grupo===b.dataset.id)) return toast('Ese sector tiene personas. Pasalas a otro sector primero.'); state.grupos = state.grupos.filter(g=>g.id!==b.dataset.id); guardar(); render(); break;
    case 'comp': { b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed')!=='true')); state.config.compensatorios = [...document.querySelectorAll('[data-a="comp"][aria-pressed="true"]')].map(x=>x.dataset.d); guardar(); break; }
    case 'copiarJson': copiar(JSON.stringify(state), 'Respaldo copiado. Guardalo en un lugar seguro.'); break;
    case 'descargar': {
      const url = URL.createObjectURL(new Blob([JSON.stringify(state,null,1)], {type:'application/json'}));
      const link = document.createElement('a'); link.href = url; link.download = `planilla-justa-${hoy()}.json`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000); toast('Si no se descargó, usá “Copiar respaldo”.'); break; }
    case 'importarTexto': importar(document.getElementById('pegado').value); break;
    case 'reset': document.getElementById('resetConf').hidden = false; break;
    case 'resetOk': state = ejemplo(); guardar(); week = lunesDe(hoy()); vista = 'planilla'; render(); toast('Listo, empezaste de cero.'); break;
  }
});

});
document.addEventListener('change', ev=>{
  const el = ev.target, val = el.type==='checkbox' ? el.checked : el.value;
  if (el.id==='aTipo'){ document.getElementById('aTxtWrap').hidden = !['curso','otro'].includes(val); document.getElementById('aParcialWrap').hidden = val!=='otro'; document.getElementById('aNota').hidden = val!=='curso'; return; }
  const card = el.closest('[data-t]');
  if (card){
    const t = tarea(card.dataset.t);
    if (el.dataset.tf) t[el.dataset.tf] = el.dataset.tf==='nombre' ? String(val).trim().toUpperCase() : val;
    else if (el.dataset.cupo) t.cupos[el.dataset.cupo] = Math.max(0, +val||0);
    guardar(); return;
  }
  const gc = el.closest('[data-g]');
  if (gc && el.dataset.gf){ const g = grupo(gc.dataset.g); g[el.dataset.gf] = ['cupoSab','maxLibres'].includes(el.dataset.gf) ? Math.max(0,+val||0) : el.dataset.gf==='base' ? String(val).trim().toUpperCase() : val; guardar(); return; }
  const ini = el.closest('[data-ini]');
  if (ini){ emp(ini.dataset.ini)[el.dataset.if] = val; if (!state.config.inicioFecha) state.config.inicioFecha = lunesDe(hoy()); guardar(); return; }
  if (el.id==='cfgVentana'){ state.config.ventana = Math.min(52, Math.max(2, +val||12)); guardar(); return; }
  if (el.id==='cfgDesc'){ state.config.descansos = String(val).split('\n').map(s=>s.trim()).filter(Boolean); guardar(); return; }
  if (el.id==='archivo' && el.files?.[0]){ const r = new FileReader(); r.onload = () => importar(String(r.result)); r.readAsText(el.files[0]); }
});

render();
if (!ls.get('guia')) setTimeout(()=>guia(0), 400);
</script>
</body></html>
